spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/keystone}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Sreya@12345}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-secret-123456}
    expiration-ms: 3600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.keystone: INFO
