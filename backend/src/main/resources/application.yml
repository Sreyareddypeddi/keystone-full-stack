spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:10000}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.keystone: INFO